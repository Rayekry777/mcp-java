server:
  port: 8090

mcp:
  security:
    # 本地调试密钥；环境变量 MCP_API_KEY 可覆盖。
    api-key: ${MCP_API_KEY:local-mcp-test-key}

spring:
  main:
    web-application-type: servlet
    banner-mode: off
  ai:
    mcp:
      server:
        name: ray-tools-server
        version: 1.0.0
        type: SYNC
        protocol: SSE
        stdio: false
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/messages

logging:
  config: classpath:logback-spring.xml
