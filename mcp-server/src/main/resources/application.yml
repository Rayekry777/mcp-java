server:
  port: 8090

spring:
  main:
    web-application-type: servlet
    banner-mode: off
  ai:
    mcp:
      server:
        name: ray-tools-server
        version: 1.0.0
        type: SYNC
        protocol: SSE
        stdio: false
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/messages

logging:
  config: classpath:logback-spring.xml
